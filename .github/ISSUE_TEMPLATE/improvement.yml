name: Improvement
description: Suggest a clarification, a new topic or chapter, or a code change.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: Who is it for, and what problem does it solve?
