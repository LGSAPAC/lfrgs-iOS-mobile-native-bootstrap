name: iOS

# Builds the app on a GitHub-hosted Mac, runs LiferayKit's tests with Apple's frameworks, and
# launches the app in the iOS Simulator for a screenshot. Liferay itself is not available here
# (no Docker on macOS runners); the "Liferay" workflow covers the server side.
#
# macOS minutes cost 10x on private repositories, so this runs only when ios/ changes, or by hand.

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test and screenshot
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Tool versions
        run: |
          xcodebuild -version
          swift --version

      - name: LiferayKit tests (macOS, CryptoKit)
        working-directory: ios/LiferayKit
        run: swift test

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          # Placeholder settings: enough to build and show the sign-in screen.
          cp Config/Local.xcconfig.example Config/Local.xcconfig

      - name: Print the generated project file
        if: always()
        run: |
          echo "=== BEGIN project.pbxproj ==="
          cat LiferaySelfService.xcodeproj/project.pbxproj
          echo "=== END project.pbxproj ==="

      - name: Pick an iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j |
            jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone"))] | last | .udid')
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build the app
        run: |
          set -o pipefail
          xcodebuild build \
            -project LiferaySelfService.xcodeproj \
            -scheme LiferaySelfService \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)"

      - name: App tests (screen models against the demo backend)
        run: |
          set -o pipefail
          xcodebuild test \
            -project LiferaySelfService.xcodeproj \
            -scheme LiferaySelfService \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log" |
            grep -E "error:|✔ Test|✘ Test|Test run with|TEST (SUCCEEDED|FAILED)|Testing failed"

      - name: Launch in the simulator and take screenshots
        run: |
          udid=${{ steps.sim.outputs.udid }}
          app="$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/LiferaySelfService.app"
          bundle=com.liferay.sample.selfservice
          shots="$RUNNER_TEMP/artifacts"
          mkdir -p "$shots"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$app"

          # 1. Normal launch: no Liferay here, so the app stops at the sign-in screen.
          xcrun simctl launch "$udid" "$bundle"
          sleep 10
          xcrun simctl io "$udid" screenshot "$shots/sign-in-screen.png"

          # 2. Demo mode (in-memory backend), one launch per tab.
          for tab in requests addresses profile; do
            xcrun simctl terminate "$udid" "$bundle" || true
            xcrun simctl launch "$udid" "$bundle" --demo --tab "$tab"
            sleep 6
            xcrun simctl io "$udid" screenshot "$shots/demo-$tab.png"
          done

      - name: Print small screenshots (for review without downloading)
        run: |
          for shot in "$RUNNER_TEMP"/artifacts/*.png; do
            name=$(basename "$shot" .png)
            sips -Z 640 "$shot" --out "$RUNNER_TEMP/small-$name.png" >/dev/null
            echo "=== BEGIN screenshot $name ==="
            base64 -i "$RUNNER_TEMP/small-$name.png" | fold -w 1000
            echo "=== END screenshot $name ==="
          done

      - name: Committed project matches project.yml
        run: |
          if ! git diff --quiet -- LiferaySelfService.xcodeproj/project.pbxproj; then
            echo "::error file=ios/project.yml::LiferaySelfService.xcodeproj is out of date. Run 'cd ios && xcodegen generate' and commit the result (it is also printed above)."
            exit 1
          fi

      - name: Package the generated project
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          if [ -d LiferaySelfService.xcodeproj ]; then
            zip -qr "$RUNNER_TEMP/artifacts/LiferaySelfService.xcodeproj.zip" LiferaySelfService.xcodeproj
          fi
          cp "$RUNNER_TEMP"/xcodebuild*.log "$RUNNER_TEMP/artifacts/" 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: ignore
