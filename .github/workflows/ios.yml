name: iOS

# Builds the app on a GitHub-hosted Mac, runs LiferayKit's tests with Apple's frameworks, and
# launches the app in the iOS Simulator for a screenshot. Liferay itself is not available here
# (no Docker on macOS runners); the "Liferay" workflow covers the server side.
#
# macOS minutes cost 10x on private repositories, so this runs only when ios/ changes, or by hand.

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test and screenshot
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Tool versions
        run: |
          xcodebuild -version
          swift --version

      - name: LiferayKit tests (macOS, CryptoKit)
        working-directory: ios/LiferayKit
        run: swift test

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          # Placeholder settings: enough to build and show the sign-in screen.
          cp Config/Local.xcconfig.example Config/Local.xcconfig

      - name: Pick an iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j |
            jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone"))] | last | .udid')
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build the app
        run: |
          set -o pipefail
          xcodebuild build \
            -project LiferaySelfService.xcodeproj \
            -scheme LiferaySelfService \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)"

      - name: Launch in the simulator and take a screenshot
        run: |
          udid=${{ steps.sim.outputs.udid }}
          app="$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/LiferaySelfService.app"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$app"
          xcrun simctl launch "$udid" com.liferay.sample.selfservice
          sleep 10
          mkdir -p "$RUNNER_TEMP/artifacts"
          xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/artifacts/sign-in-screen.png"

      - name: Package the generated project
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          if [ -d LiferaySelfService.xcodeproj ]; then
            zip -qr "$RUNNER_TEMP/artifacts/LiferaySelfService.xcodeproj.zip" LiferaySelfService.xcodeproj
          fi
          cp "$RUNNER_TEMP/xcodebuild.log" "$RUNNER_TEMP/artifacts/" 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: ignore
