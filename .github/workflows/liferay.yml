name: Liferay

# Keeps the tutorial honest: starts the same Liferay DXP 2026.Q1 container readers use, runs the
# setup script twice (it must be safe to re-run), then checks every API call the app depends on.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint scripts and docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: shellcheck -x -S style liferay/scripts/*.sh

      - name: JSON files are valid
        run: |
          status=0
          while IFS= read -r -d '' file; do
            jq empty "$file" || { echo "::error file=$file::invalid JSON"; status=1; }
          done < <(find . -name '*.json' -not -path './.git/*' -print0)
          exit $status

      - name: Relative Markdown links resolve
        run: python3 .github/scripts/check_md_links.py

  liferaykit:
    name: LiferayKit unit tests (Linux)
    runs-on: ubuntu-latest
    # Runs the platform-independent Swift code (OAuth, PKCE, API client, models) against the
    # recorded fixtures. Apple-only code (Keychain, sign-in sheet, SwiftUI) is built in Xcode.
    container: swift:6.1
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ios/LiferayKit
    steps:
      - uses: actions/checkout@v7

      - name: swift test
        run: swift test

  liferay-api:
    name: Liferay API smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: liferay
    steps:
      - uses: actions/checkout@v7

      - name: Start Liferay DXP
        run: docker compose up -d

      - name: Configure Liferay (first run)
        run: ./scripts/setup.sh
        env:
          WAIT_MINUTES: 20

      - name: Configure Liferay again (must be idempotent)
        run: ./scripts/setup.sh

      - name: Smoke test as the self-service users
        run: ./scripts/smoke-test.sh

      - name: Record fixtures and compare their shape
        run: |
          ./scripts/record-fixtures.sh "$RUNNER_TEMP/fixtures"
          # Ids and dates differ between runs; compare only the JSON structure (sorted key paths).
          # lastLoginDate/loginDate only exist once a user has signed in through the browser.
          shape() {
            jq -c '[paths | select(.[0] != "lastLoginDate" and .[0] != "loginDate")
              | map(if type == "number" then 0 else . end)] | unique | .[]' "$1"
          }
          status=0
          for recorded in "$RUNNER_TEMP"/fixtures/*.json; do
            name="$(basename "$recorded")"
            committed="../ios/LiferayKit/Tests/LiferayKitTests/Fixtures/$name"
            if ! changes=$(diff <(shape "$committed") <(shape "$recorded")); then
              echo "::error file=ios/LiferayKit/Tests/LiferayKitTests/Fixtures/$name::$name: response shape changed"
              echo "--- $name ('<' committed only, '>' new response only)"
              echo "$changes" | grep '^[<>]' | head -40
              status=1
            fi
          done
          exit $status

      - name: Upload recorded fixtures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recorded-fixtures
          path: ${{ runner.temp }}/fixtures
          if-no-files-found: ignore

      - name: Liferay logs
        if: failure()
        run: docker compose logs --tail 300 liferay

      - name: Diagnostics (runner resources and Liferay threads)
        if: failure()
        run: |
          echo "--- runner: $(nproc) CPUs"; free -m
          echo "--- containers"; docker stats --no-stream
          dump="$RUNNER_TEMP/diagnostics/thread-dump.txt"
          mkdir -p "$(dirname "$dump")"
          docker compose exec -T liferay sh -c \
            'jcmd "$(pgrep -f org.apache.catalina.startup.Bootstrap | head -1)" Thread.print -l' > "$dump" || true
          docker compose logs liferay > "$RUNNER_TEMP/diagnostics/liferay.log" 2>&1 || true

          # Print every thread holding a lock that another thread is waiting for (with its stack),
          # plus the JVM's own deadlock report. The full dump is uploaded as an artifact.
          python3 - "$dump" <<'EOF'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          threads = [t for t in re.split(r"\n(?=\")", text) if t.startswith('"')]
          waited = set(re.findall(r"waiting to lock <(0x[0-9a-f]+)>", text))
          print(f"--- {len(threads)} threads; {len(waited)} contended lock(s): {', '.join(sorted(waited))}")
          for t in threads:
              held = set(re.findall(r"- locked <(0x[0-9a-f]+)>", t)) & waited
              if held:
                  print(f"\n=== holds {', '.join(sorted(held))} ===")
                  print("\n".join(t.splitlines()[:80]))
          if "Found one Java-level deadlock" in text or "deadlock" in text.lower():
              print("\n--- JVM deadlock report ---")
              print(text[text.lower().find("found"):][:6000])
          EOF

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: liferay-diagnostics
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: ignore
