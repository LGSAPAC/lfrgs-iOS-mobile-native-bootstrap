##
## Local development settings for the iOS tutorial. Do NOT use in production.
##

# The Docker image ships a pre-built Hypersonic database. Point Liferay at a new database file so
# the first start creates a fresh instance, and the first-login settings below actually apply.
jdbc.default.url=jdbc:hsqldb:${liferay.home}/data/hypersonic-tutorial/lportal;hsqldb.lock_file=false

# Skip the first-run setup wizard; the default admin is test@liferay.com / test.
setup.wizard.enabled=false

# Let the tutorial's users sign in without extra first-login screens.
terms.of.use.required=false
users.reminder.queries.enabled=false
passwords.default.policy.change.required=false

# Users created by the setup script must not be asked to verify their email address first.
company.security.strangers.verify=false
